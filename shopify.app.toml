client_id = "33c46bc55ee0095a97e24c20901a3ec0"
name = "affiliate-engine"
application_url = "https://camera-with-robbie-congressional.trycloudflare.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customer_events,write_metaobject_definitions,write_metaobjects,write_pixels,write_products"

[auth]
redirect_urls = [
  "https://camera-with-robbie-congressional.trycloudflare.com/api/auth"
]
