# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "33c46bc55ee0095a97e24c20901a3ec0"
name = "affiliate-engine"
application_url = "https://localhost:3000"
embedded = true

[build]
automatically_update_urls_on_dev = true

# Shopify exige que esta sección exista, pero NO que tenga suscripciones
[webhooks]
api_version = "2025-01"
subscriptions = []

[access_scopes]
scopes = "read_customer_events,write_metaobject_definitions,write_metaobjects,write_pixels,write_products"

[auth]
redirect_urls = [
  "https://localhost:3000/api/auth"
]
